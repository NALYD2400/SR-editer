
<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal · SR Editer</title>
  <link rel="icon" type="image/png" href="assets/logo_small.png" />
  
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,300,400&f[]=clash-display@200,400,700,500,600,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/awwwards.css?v=6" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="aww-page">
  <!-- 3D Video Background -->
  <div class="site-bg-container" aria-hidden="true">
    <video class="site-bg-video" src="assets/videos/bg-landscape.mp4" preload="auto" muted playsinline poster="assets/videos/bg-landscape-poster.webp" loop autoplay></video>
    <div class="site-bg-overlay"></div>
    <div class="site-bg-grain"></div>
  </div>


  <!-- Awwwards Header -->
  <header class="aww-header" data-gsap="fade-down">
    <div class="aww-header-inner">
      <a href="index.html" class="aww-logo" data-magnetic>
        <img src="assets/logo_small.png" alt="SR Editer" />
        <span class="aww-logo-text">SR<br>EDITER</span>
      </a>
      <nav class="aww-nav">
        <a href="index.html" class="aww-link" data-magnetic><span class="aww-link-inner" data-hover="HOME">HOME</span></a>
        <a href="dashboard.html" class="aww-link" data-magnetic><span class="aww-link-inner" data-hover="DASHBOARD">DASHBOARD</span></a>
        <a href="library.html" class="aww-link" data-magnetic><span class="aww-link-inner" data-hover="LIBRARY">LIBRARY</span></a>
        <a href="docs.html" class="aww-link" data-magnetic><span class="aww-link-inner" data-hover="DOCS">DOCS</span></a>
        <a href="blog.html" class="aww-link" data-magnetic><span class="aww-link-inner" data-hover="BLOG">BLOG</span></a>
        <a href="login.html" class="aww-link aww-nav-portal-mobile" data-magnetic><span class="aww-link-inner" data-hover="PORTAL">PORTAL</span></a>
      </nav>
      <div class="aww-header-actions">
        <a href="login.html" class="aww-btn aww-btn-outline" data-magnetic>
          <span class="aww-btn-text">PORTAL</span>
        </a>
        <button type="button" class="aww-burger-btn" id="aww-burger-btn" aria-label="Menu" aria-expanded="false">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>
  
  <main class="aww-smooth-scroll">

      <section class="aww-auth-section">
        <div class="aww-auth-container" data-gsap="fade-up">
          <h1 class="aww-auth-title" id="auth-title-heading">Se connecter</h1>
          <p class="aww-auth-subtitle" id="auth-subtitle">Connecte-toi pour accéder au studio.</p>
          
          <div class="auth-social-row">
            <button type="button" class="auth-social-btn auth-discord-btn" id="discord-btn">
              <svg viewBox="0 0 127.14 96.36" width="18" height="18" fill="currentColor">
                <path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.08 0A72.37 72.37 0 0 0 45.67 0a105.14 105.14 0 0 0-26.23 8.07C2.93 32.33-3.1 56 1.34 79.23a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.1 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 62.72 0c.86.66 1.75 1.34 2.66 2a68.3 68.3 0 0 1-10.85 5.18 77.7 77.7 0 0 0 6.89 11.1 105.73 105.73 0 0 0 32.17-16.15c5.01-26.65-2.22-49.88-18.1-71.16ZM42.45 65.69c-6.11 0-11.14-5.63-11.14-12.56S36.21 40.57 42.45 40.57c6.2 0 11.23 5.71 11.14 12.56 0 6.93-4.94 12.56-11.14 12.56Zm42.24 0c-6.11 0-11.14-5.63-11.14-12.56S78.49 40.57 84.69 40.57c6.2 0 11.23 5.71 11.14 12.56 0 6.93-4.94 12.56-11.14 12.56Z" />
              </svg>
              <span>Discord</span>
            </button>
            <button type="button" class="auth-social-btn auth-social-btn--disabled" disabled title="Arrive bientôt">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
              <span>Google</span>
            </button>
          </div>

          <div class="auth-divider">
            <span>ou</span>
          </div>
          
          <form class="aww-auth-form" id="auth-form">
            <div class="aww-input-group">
              <label for="email">Email</label>
              <input type="email" id="email" class="aww-input" placeholder="ex. alex@sr-editer.fr" required autocomplete="email" />
            </div>
            <div class="aww-input-group">
              <label for="password">Mot de passe</label>
              <div class="password-input-wrapper">
                <input type="password" id="password" class="aww-input" placeholder="Sécurise ton compte" required autocomplete="current-password" />
                <button type="button" class="password-toggle-btn" id="password-toggle" aria-label="Afficher le mot de passe" title="Afficher le mot de passe">
                  <svg id="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>
            <div class="aww-input-group" id="confirm-password-field" hidden>
              <label for="confirm-password">Confirmer le mot de passe</label>
              <div class="password-input-wrapper">
                <input type="password" id="confirm-password" class="aww-input" placeholder="Répète ton mot de passe" autocomplete="new-password" />
              </div>
            </div>
            
            <div id="error-message" class="aww-auth-error"></div>
            <div id="success-message" style="color:var(--accent); text-align:center; margin-top:1rem;"></div>
            <a id="discord-recovery-link" hidden></a>

            <button type="submit" class="auth-submit-btn" id="submit-btn">
              Se connecter
            </button>
            <div class="aww-auth-footer" id="auth-switch">
              Pas encore de compte ? <button type="button" class="aww-text-btn" id="switch-to-signup">S'inscrire</button>
            </div>
          </form>
        </div>
      </section>
      
      <!-- Modals for Discord Requirements -->
      <div id="discord-required-modal" hidden>
        <div class="discord-required-dialog">
          <p id="discord-required-message"></p>
          <a id="discord-required-join"></a>
          <button id="discord-required-retry"></button>
          <button id="discord-required-close">Close</button>
        </div>
      </div>

      <footer class="aww-footer">
        <div class="aww-footer-content">
          <div class="aww-footer-top">
            <h2 class="aww-footer-title" data-gsap="split-text">EXPERIENCE<br>MODDING</h2>
            <a href="https://github.com/NALYD2400/SR-editer/releases/download/0.7.1/SR.Editer_0.7.1_x64-setup.exe" class="aww-btn aww-btn-solid aww-btn-massive" id="download-btn-2" data-magnetic>
              <span class="aww-btn-text">GET SR EDITER</span>
            </a>
          </div>
          <div class="aww-footer-bottom">
            <p>© 2026 SR Editer. Not affiliated with Rockstar Games.</p>
            <div class="aww-footer-links">
              <a href="privacy.html" class="aww-link">Privacy</a>
              <a href="terms.html" class="aww-link">Terms</a>
            </div>
          </div>
        </div>
      </footer>
  </main>

  <!-- Libraries -->
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/split-type"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  
  <!-- Core Logic & Animations -->
  <script src="js/config.js"></script>
  <script src="js/sr-supabase.js"></script>
  <script src="js/awwwards.js"></script>
  <script src="js/portal-login.js"></script>
</body>
</html>
