<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <!-- La 404 peut être servie à n'importe quelle profondeur d'URL : tous les liens partent de la racine -->
  <base href="/" />
  <title>Page introuvable · SR Editer</title>
  <link rel="icon" type="image/png" href="assets/logo_small.png" />

  <!-- Polices : une requête par famille (Fontshare ignore la 2e famille d'une requête groupée) -->
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@200,300,400,500,600,700&display=swap" />
  <link rel="stylesheet" href="styles/site/base.css" />
  <link rel="stylesheet" href="styles/site/layout.css" />
  <link rel="stylesheet" href="styles/site/components.css" />
  <link rel="stylesheet" href="styles/pages/error.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
</head>
<body class="aww-page aww-page--reading">
  <!-- Fond vidéo -->
  <div class="site-bg-container" aria-hidden="true">
    <video class="site-bg-video" src="assets/videos/bg-landscape.mp4" preload="auto" muted playsinline poster="assets/videos/bg-landscape-poster.webp" loop autoplay></video>
    <div class="site-bg-overlay"></div>
    <div class="site-bg-grain"></div>
  </div>

  <!-- Header -->
  <header class="aww-header" data-gsap="fade-down">
    <div class="aww-header-inner">
      <a href="index.html" class="aww-logo">
        <img src="assets/logo_small.png" alt="SR Editer" />
        <span class="aww-logo-text">SR<br>EDITER</span>
      </a>
      <nav class="aww-nav">
        <a href="index.html" class="aww-link"><span class="aww-link-inner" data-hover="HOME">HOME</span></a>
        <a href="dashboard.html" class="aww-link"><span class="aww-link-inner" data-hover="DASHBOARD">DASHBOARD</span></a>
        <a href="library.html" class="aww-link"><span class="aww-link-inner" data-hover="LIBRARY">LIBRARY</span></a>
        <a href="docs.html" class="aww-link"><span class="aww-link-inner" data-hover="DOCS">DOCS</span></a>
        <a href="blog.html" class="aww-link"><span class="aww-link-inner" data-hover="BLOG">BLOG</span></a>
        <a href="login.html" class="aww-link aww-nav-portal-mobile"><span class="aww-link-inner" data-hover="PORTAL">PORTAL</span></a>
      </nav>
      <div class="aww-header-actions">
        <a href="login.html" class="aww-btn aww-btn-outline" data-magnetic>
          <span class="aww-btn-text">PORTAL</span>
        </a>
        <button type="button" class="aww-burger-btn" id="aww-burger-btn" aria-label="Menu" aria-expanded="false">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main class="aww-smooth-scroll">
    <section class="aww-hero aww-error-hero">
      <div class="aww-hero-content aww-error-content">
        <div class="aww-kicker">ERREUR 404</div>

        <!-- Le "404" s'incline en 3D en suivant la souris (js/pages/error.js) -->
        <h1 class="aww-hero-heading aww-error-code" aria-label="Erreur 404">4<span class="aww-text-stroke">0</span>4</h1>

        <p class="aww-error-title">Page introuvable</p>
        <p class="aww-hero-desc">
          La page que vous cherchez n'existe pas ou a été déplacée.
        </p>

        <div class="aww-hero-actions">
          <a href="index.html" class="aww-btn aww-btn-solid" data-magnetic>
            <span class="aww-btn-text">RETOUR À L'ACCUEIL</span>
          </a>
          <a href="docs.html" class="aww-btn aww-btn-outline" data-magnetic>
            <span class="aww-btn-text">DOCUMENTATION</span>
          </a>
        </div>

        <nav class="aww-error-links" aria-label="Pages principales">
          <a href="library.html" class="aww-error-link">Library <span aria-hidden="true">↗</span></a>
          <a href="blog.html" class="aww-error-link">Blog <span aria-hidden="true">↗</span></a>
          <a href="dashboard.html" class="aww-error-link">Dashboard <span aria-hidden="true">↗</span></a>
        </nav>
      </div>

      <p class="aww-error-footnote">© 2026 SR Editer. Not affiliated with Rockstar Games.</p>
    </section>
  </main>

  <!-- Librairies -->
  <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/split-type@0.3.4/umd/index.min.js" integrity="sha384-wQImCCD/id1jPTwSloatzKlEpnEAQ5aH8H2Ud27FnNcJ1lf2+hB75ctoWnWxyD8X" crossorigin="anonymous"></script>

  <!-- Site -->
  <script src="js/core/config.js"></script>
  <script src="js/core/supabase.js"></script>
  <script src="js/core/header-auth.js"></script>
  <script src="js/core/site.js"></script>

  <!-- Page -->
  <script src="js/pages/error.js"></script>
</body>
</html>
